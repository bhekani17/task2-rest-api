services:
  - type: web
    name: sky-bank
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      - key: MANSA_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
