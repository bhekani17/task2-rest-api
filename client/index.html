<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Bank | Dashboard</title>
    <link rel="icon" type="image/jpeg" href="/images/bg.png">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="dashboard-page">
    <div class="page-shell">
        <aside class="sidebar">
            <div class="brand">
                <img class="brand-logo" src="/images/bg.png" alt="Sky Bank">
            </div>

            <nav class="sidebar-nav" aria-label="Main navigation">
                <div class="nav-group">
                    <span class="nav-section-title">Workspace</span>
                    <a class="nav-link active" href="/dashboard" aria-current="page">Dashboard</a>
                    <a class="nav-link" href="/profile">My profile</a>
                </div>
                <div class="nav-group">
                    <span class="nav-section-title">Banking</span>
                    <a class="nav-link" href="/accounts">Accounts</a>
                    <a class="nav-link" href="/transfers">Transfers</a>
                    <a class="nav-link" href="/transactions">Transactions</a>
                    <a class="nav-link investment-nav-link" href="/investments">Investments</a>
                </div>
                <div id="adminNavigationGroup" class="nav-group" hidden>
                    <span class="nav-section-title">Administration</span>
                    <a class="nav-link" href="/admin">Admin</a>
                </div>
                <button id="logoutButton" class="nav-link" type="button">Sign out</button>
            </nav>
        </aside>

        <main class="main">
            <div class="topbar">
                <div>
                    <h1 class="page-title">Banking dashboard</h1>
                </div>
                <div class="top-actions">
                    <a class="primary-btn" href="/transfers">Make a transfer</a>
                    <div class="profile-photo-control">
                        <img id="profilePhoto" class="profile-photo" alt="Your profile photo" hidden>
                        <label class="profile-photo-label" for="profilePhotoInput">Profile photo</label>
                        <input id="profilePhotoInput" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp">
                        <button id="removeProfilePhotoButton" class="profile-photo-remove" type="button" hidden>Remove</button>
                    </div>
                    <button id="themeToggle" class="theme-toggle" type="button">Dark</button>
                </div>
            </div>

            <section class="stats">
                <div class="stat-card">
                    <div class="stat-label">Accounts</div>
                    <div id="totalAccounts" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total balance</div>
                    <div id="totalBalance" class="stat-value">R 0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Recent activity</div>
                    <div id="totalTransactions" class="stat-value">0</div>
                </div>
            </section>

            <section class="content-grid" aria-label="Banking overview">
                <section id="accountsSection" class="panel-card overview-panel" aria-labelledby="accountsHeading">
                    <div class="dashboard-header">
                        <h2 id="accountsHeading">Accounts</h2>
                        <a class="panel-link" href="/accounts">Manage accounts</a>
                    </div>
                    <p id="status" class="filter-status" role="status" aria-live="polite"></p>
                    <div id="accounts" class="account-list"></div>
                </section>

                <section id="activitySection" class="panel-card activity-panel" aria-labelledby="activityHeading">
                    <div class="transaction-toolbar">
                        <h2 id="activityHeading">Recent transactions</h2>
                        <a class="panel-link" href="/transactions">View all</a>
                    </div>
                    <p id="transactionFilterStatus" class="filter-status" role="status" aria-live="polite"></p>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="transactions"></tbody>
                        </table>
                    </div>
                </section>
            </section>

            <section id="notificationsSection" class="panel-card single-panel" aria-labelledby="notificationsHeading">
                <div class="dashboard-header">
                    <div class="inline-heading-group">
                        <h2 id="notificationsHeading">Notifications</h2>
                        <span id="notificationUnreadBadge" class="status-badge" hidden>0 unread</span>
                    </div>
                    <button id="markNotificationsReadButton" class="filter-button" type="button">Mark all read</button>
                </div>
                <p id="notificationsStatus" class="filter-status" role="status" aria-live="polite"></p>
                <div id="notificationsList" class="account-list"></div>
            </section>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
