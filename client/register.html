<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Bank | Register</title>
    <link rel="icon" type="image/jpeg" href="/images/bg.png">
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
    <div class="page-shell">
        <aside class="sidebar">
            <div class="brand">
                <img class="brand-logo" src="/images/bg.png" alt="Sky Bank">
            </div>

            <nav class="sidebar-nav">
                <a class="nav-link" href="/">Welcome</a>
                <a class="nav-link" href="/login">Login</a>
                <a class="nav-link active" href="/register">Register</a>
            </nav>
        </aside>

        <main class="main">
            <div class="panel">
                <div class="topbar">
                    <h1>Register</h1>
                    <button id="themeToggle" class="theme-toggle" type="button">Dark</button>
                </div>

                <form id="registerForm">
                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" placeholder="Enter your full name" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="Enter your email" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" placeholder="Use at least 12 characters" required>
                    </div>

                    <button type="submit">Create Account</button>
                </form>

                <p id="message" role="status" aria-live="polite"></p>
            </div>
        </main>
    </div>
    <script src="/js/register.js"></script>
</body>
</html>
